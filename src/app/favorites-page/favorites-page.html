<section class="wrap">
  <h1>I tuoi preferiti</h1>

  <div class="grid">
    @for (p of items(); track p.id) {
      <article class="p-card">
        <a class="p-cardLink" [routerLink]="['/products', p.id]">
          <img class="p-card__img" [src]="imageUrl(p.copertina || '')" />
          <h3>{{ p.titolo }}</h3>
          <p>{{ p.autore.nome }} {{ p.autore.cognome }}</p>
        </a>
      </article>
    }
  </div>

  @if (items.length === 0) {
    <p class="empty">Nessun preferito salvato.</p>
  }
</section>
