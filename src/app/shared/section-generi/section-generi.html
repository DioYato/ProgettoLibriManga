<section class="section_generi_slim">
  <div class="header_container">
    <h3 class="section_subtitle">Esplora i Generi</h3>
    <div class="subtitle_line"></div>
  </div>

  <div class="carousel_layout_wrapper">
    <button class="nav_btn_side prev" (click)="scroll(-1)">
      <i class="fas fa-chevron-left"> < </i>
    </button>

    <div class="carousel_container">
      <div class="generi_viewport" #carousel>
        @for (genere of listaGeneri; track genere.id) {
          <div class="card_genere_medium" (click)="navigaFiltro(genere.name)">
            <img [src]="genere.image" [alt]="genere.name" class="card_img" />

            <div class="card_overlay_bottom">
              <h3 class="card_title">{{ genere.name }}</h3>
            </div>
          </div>
        }
      </div>
    </div>

    <button class="nav_btn_side next" (click)="scroll(1)">
      <i class="fas fa-chevron-right"> ></i>
    </button>
  </div>
</section>
