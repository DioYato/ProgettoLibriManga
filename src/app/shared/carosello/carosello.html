<div class="carousel-container">
  <div class="carousel-viewport" #carousel>
    <div class="carousel-track">
      <img src="https://picsum.photos/1200/400?random=1" alt="Slide 1" />
      <img src="https://picsum.photos/1200/400?random=2" alt="Slide 2" />
      <img src="https://picsum.photos/1200/400?random=3" alt="Slide 3" />
    </div>

    <div class="dots-container">
      <span class="dot" [class.active]="currentIndex === 0" (mouseenter)="goToSlide(0)"></span>
      <span class="dot" [class.active]="currentIndex === 1" (mouseenter)="goToSlide(1)"></span>
      <span class="dot" [class.active]="currentIndex === 2" (mouseenter)="goToSlide(2)"></span>
    </div>
  </div>

  <button class="nav-btn prev" (click)="move(-1)"> < </button>
  <button class="nav-btn next" (click)="move(1)"> > </button>
</div>
