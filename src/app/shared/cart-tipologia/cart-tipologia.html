<div class="section">
    <div class="img_cont">
        <div class="colonna_1 colonna_libri">
            <img src="sezione_libri.jpg" alt="Sezione Libri">
            <button class="btn-overlay" (click)="navigaProdotti('libri')">
              Vai alla sezione libri
            </button>
        </div>
       
        <div class="colonna_1 colonna_manga">
            
            <div class="manga-grid">
              <div class="manga-item" *ngFor="let cover of mangaCovers">
                <img [src]="cover" alt="Manga Cover">
              </div>
            </div>

            <div class="grid-overlay"></div>

            <button class="btn-overlay" (click)="navigaProdotti('manga')">
              Vai alla sezione manga
            </button>
        </div>
    </div>
</div>
