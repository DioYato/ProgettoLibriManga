<div class="main-wrapper">
  <h2 class="section-title">Gli autori del momento</h2>

  <div class="carousel-container">
    <button class="nav-btn prev" (click)="scroll(-1)">
      <span class="chevron">‹</span>
    </button>

    <div class="cards-viewport" #containerCarosello>
      @for (autore of Autori; track autore.id) {
        <div class="card-autore">
          <div class="card-content">
            <div class="image-box">
              <img [src]="autore.img" [alt]="autore.nome">
            </div>
            <div class="name-banner">
              {{ autore.nome }}
            </div>
          </div>
        </div>
      }
    </div>

    <button class="nav-btn next" (click)="scroll(1)">
      <span class="chevron">›</span>
    </button>
  </div>
</div>
