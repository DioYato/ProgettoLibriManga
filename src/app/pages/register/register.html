<form class="auth-form" [formGroup]="form" (ngSubmit)="onSubmit()">
  <div class="row-2">
    <label>
      <span class="field-label">Nome*</span>
      <input type="text" formControlName="nome" />
    </label>
    <label>
      <span class="field-label">Cognome*</span>
      <input type="text" formControlName="cognome" />
    </label>
  </div>

  <label>
    <span class="field-label">Email*</span>
    <input type="email" formControlName="email" />
  </label>

  <label>
    <span class="field-label">Password*</span>
    <input type="password" formControlName="password" />
  </label>

  <label>
    <span class="field-label">Conferma password*</span>
    <input type="password" formControlName="confermaPassword" />
  </label>

  <button type="submit" class="primary-btn">Crea account</button>
</form>
