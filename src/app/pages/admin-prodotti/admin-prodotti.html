<div class="admin-prodotti-container">
  <h1>Gestisci Prodotti</h1>

  <div class="add-product-form">
    <h2>Aggiungi Nuovo Libro / Manga</h2>

    <form (ngSubmit)="addProduct()">

      <!-- Titolo -->
      <div class="form-group">
        <label for="titolo">Titolo:</label>
        <input type="text" id="titolo" [(ngModel)]="newProduct.titolo" name="titolo" required>
      </div>

      <!-- Descrizione -->
      <div class="form-group">
        <label for="descrizione">Descrizione:</label>
        <textarea id="descrizione" [(ngModel)]="newProduct.descrizione" name="descrizione"></textarea>
      </div>

      <!-- Libro / Manga -->
      <div class="form-group">
        <label for="tipo">Tipologia:</label>
        <select id="tipo" [(ngModel)]="newProduct.tipo" name="tipo" required>
          <option value="libro">Libro</option>
          <option value="manga">Manga</option>
        </select>
      </div>

      <!-- Autore -->
      <div class="form-group">
        <label>Autore:</label>
        <input type="text" placeholder="Nome" [(ngModel)]="newProduct.autoreNome" name="autoreNome" required>
        <input type="text" placeholder="Cognome" [(ngModel)]="newProduct.autoreCognome" name="autoreCognome" required>
      </div>

      <!-- Casa Editrice -->
      <div class="form-group">
        <label for="casa">Casa Editrice:</label>
        <input type="text" id="casa" [(ngModel)]="newProduct.casaEditrice" name="casaEditrice" required>
      </div>

      <!-- Immagine -->
      <div class="form-group">
        <label for="img">Copertina:</label>
        <input type="file" id="img" (change)="onFileSelected($event)" accept="image/*" required>
      </div>

      <!-- Prezzo -->
      <div class="form-group">
        <label for="prezzo">Prezzo (€):</label>
        <input type="number" id="prezzo" [(ngModel)]="newProduct.prezzo" name="prezzo" min="0" step="0.01" required>
      </div>

      <!-- Quantità -->
      <div class="form-group">
        <label for="quantita">Quantità Disponibile:</label>
        <input type="number" id="quantita" [(ngModel)]="newProduct.quantitaDisponibile" name="quantita" min="0" required>
      </div>

      <button type="submit">Salva Prodotto nel Database</button>
    </form>
  </div>
</div>
