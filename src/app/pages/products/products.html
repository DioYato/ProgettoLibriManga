<div class="products-page">
  <aside class="filters-container">
    <app-products-filters (filtersChange)="onFiltersChange($event)"></app-products-filters>
  </aside>

  <main class="products-content">
    <section class="wrap">
      <div class="head">
        <h1>I nostri prodotti</h1>
      </div>

      <select class="sort-select" (change)="onSortChange($event)">
        <option value="">In evidenza</option>
        <option value="prezzoAsc">Prezzo crescente</option>
        <option value="prezzoDesc">Prezzo decrescente</option>
      </select>

      <div class="toolbar">
        <input type="search" placeholder="Cerca un titolo…" [value]="query()" (input)="onSearch($any($event.target).value)" />
      </div>

      <div class="grid">
        @for (p of products(); track p.id; let i = $index) {
          <article class="p-card">
            
            <!-- TASTO ELIMINA: Visibile solo se isModerator() è true -->
            @if (isModerator()) {
              <button class="admin-delete-btn" (click)="deleteProduct(p.id); $event.stopPropagation()">
                🗑️ Elimina
              </button>
            }

            <button class="fav-btn" (click)="toggleFavorite(p.id); $event.stopPropagation()">
              <span [class.filled]="isFavorite(p.id)">♥</span>
            </button>

            <a class="p-cardLink" [routerLink]="['/products', p.id]">
              <div class="p-card__media">
                <img class="p-card__img" [src]="imageUrl(p.copertina)" [alt]="p.titolo" />
              </div>
              <h3 class="p-card__title">{{ p.titolo }}</h3>
              <div class="p-card__priceRow">€{{ p.prezzo | number: '1.2-2' }}</div>
            </a>
          </article>
        }
      </div>

      @if (products().length === 0) {
        <p class="empty">Nessun prodotto trovato.</p>
      }
    </section>
  </main>
</div>
