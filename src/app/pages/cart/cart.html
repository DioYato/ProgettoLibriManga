<section class="cart">
  <h1>Carrello</h1>

  @if (items().length === 0) {
    <p>Il carrello è vuoto.</p>
  } @else {
    <ul>
      @for (item of items(); track item.product.id) {
        <li>
          <strong>{{ item.product.titolo }}</strong>
          — {{ item.quantity }} × €{{ item.product.prezzo }}
        </li>
      }
    </ul>

    <h2>Totale: €{{ total() }}</h2>
  }
</section>
