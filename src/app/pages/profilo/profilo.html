<h2 class="profile-title">Profilo Utente</h2>

<form class="profile-form" [formGroup]="form" (ngSubmit)="salva()">

  <label class="profile-label">Nome</label>
  <input class="profile-input" formControlName="nome">

  <label class="profile-label">Cognome</label>
  <input class="profile-input" formControlName="cognome">

  <label class="profile-label">Email</label>
  <input class="profile-input" formControlName="email">

  <label class="profile-label">Nuova Password (opzionale)</label>
  <input type="password" class="profile-input" formControlName="password">

  <button type="submit" class="profile-button">Salva modifiche</button>
</form>
