<div class="auth-overlay">
  <div class="auth-dialog">
    <div class="auth-header">
      <h2>Accedi/Registrati</h2>
      <button class="auth-close" routerLink="/">×</button>
    </div>

    <div class="auth-tabs">
      <button class="tab active">Accedi</button>
      <button class="tab" routerLink="/register">Registrati</button>
    </div>

    <div class="auth-social">
      <span class="label">Accedi con:</span>
      <div class="icons">
        <button type="button" class="social fb">f</button>
        <button type="button" class="social apple"></button>
      </div>
    </div>

    <hr />

    <form class="auth-form">
      <label>
        <span class="field-label">Email*</span>
        <input type="email" />
      </label>

      <label>
        <span class="field-label">Password*</span>
        <input type="password" />
      </label>

      <a class="forgot" href="#">Hai dimenticato la password?</a>

      <label class="remember">
        <input type="checkbox" />
        <span>Ricordami</span>
      </label>

      <button type="submit" class="primary-btn">Accedi</button>
    </form>
  </div>
</div>
