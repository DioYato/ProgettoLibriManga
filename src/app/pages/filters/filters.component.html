<div class="filters">

  <h3>Tipologia</h3>
  @for (t of tipologie; track t.id) {
    <label>
      <input type="checkbox" (change)="toggleGenre(t.id, $event)">
      {{ t.categoria }}
    </label>
  }

  <h3>Genere</h3>
  @for (g of generi; track g.id) {
    <label>
      <input type="checkbox" (change)="toggleGenre(g.id, $event)">
      {{ g.categoria }}
    </label>
  }
  <button class="apply-btn" (click)="apply()">Applica</button>


</div>
